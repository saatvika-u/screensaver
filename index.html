<!DOCTYPE html>
<html>
<head>
    <title>Digital Clock</title>

    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="jedi.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <audio id="background-music" autoplay preload="auto">
        <source src="The%20Imperial%20Suite.mp3" type="audio/mpeg">
    </audio>

    <div id="clock-container">
        <div id="clock">00:00:00 <span class="ampm">AM</span></div>
        <div id="date">Monday, 1 January 1999</div>
        <canvas id="audio-bars" aria-hidden="true"></canvas>
    </div>
    <div id="music-message">Press Space to start music</div>

    <script src="script.js"></script>
</body>
</html>
